
name: Update GoalZone Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get GoalZone files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upcoming football matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import datetime
          import time

          token = os.environ["FOOTBALL_DATA_TOKEN"]

          leagues = {
              "Premier League": "PL",
              "La Liga": "PD",
              "Bundesliga": "BL1",
              "Serie A": "SA",
              "Ligue 1": "FL1",
              "Champions League": "CL"
          }

          today = datetime.date.today()
          end_date = today + datetime.timedelta(days=30)

          all_matches = []
          errors = []

          for name, code in leagues.items():
              params = urllib.parse.urlencode({
                  "dateFrom": today.isoformat(),
                  "dateTo": end_date.isoformat(),
                  "status": "SCHEDULED,TIMED"
              })

              url = (
                  f"https://api.football-data.org/v4/"
                  f"competitions/{code}/matches?{params}"
              )

              request = urllib.request.Request(
                  url,
                  headers={"X-Auth-Token": token}
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode())

                  for match in data.get("matches", []):
                      all_matches.append({
                          "league": name,
                          "home": match["homeTeam"]["name"],
                          "away": match["awayTeam"]["name"],
                          "date": match["utcDate"],
                          "status": match["status"]
                      })

                  print(f"{name}: fetched successfully")

              except Exception as error:
                  errors.append(f"{name}: {error}")
                  print(f"{name}: unavailable - {error}")

              time.sleep(2)

          output = {
              "updated": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "matches": all_matches,
              "errors": errors
          }

          with open("fixtures.json", "w") as file:
              json.dump(output, file, indent=2)

          print("Total matches:", len(all_matches))
          PY

      - name: Save updated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json
          git diff --cached --quiet || (
            git commit -m "Update GoalZone fixtures"
            git push
          )
